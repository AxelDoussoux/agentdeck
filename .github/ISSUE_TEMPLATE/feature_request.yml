name: Feature request
description: Suggest an idea or a new agent to support
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Your idea
      description: How AgentDeck could help. Screenshots or sketches are welcome.
