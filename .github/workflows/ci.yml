name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The Ubuntu mirror is sometimes slow enough to take more than ten
      # minutes for these packages: they come from the cache instead.
      - name: Cache Linux packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.os }}-webkit2gtk-4.1-v1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # A stuck mirror fails the job in minutes instead of holding it for hours.
        timeout-minutes: 15
        run: |
          # man-db rebuilds its index after each install, which can take minutes.
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-archives/partial
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives"
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y $apt_options \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # The cache step saves the folder as this user.
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$USER" ~/apt-archives
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm sidecar --debug
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
