name: Release

# Pushing a tag like v0.1.0 builds the installers on every OS and attaches
# them to a draft GitHub release, with the signed updater artifacts and the
# latest.json the in-app updater reads. Publish the draft to ship it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The Ubuntu mirror is sometimes slow enough to take more than ten
      # minutes for these packages: they come from CI's cache instead.
      - name: Cache Linux packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.os }}-webkit2gtk-4.1-v1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # A stuck mirror fails the job instead of holding it for hours; on a
        # slow day, a cache miss can take more than 15 minutes.
        timeout-minutes: 30
        run: |
          # man-db rebuilds its index after each install, which can take minutes.
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-archives/partial
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives"
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y $apt_options \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # The cache step saves the folder as this user.
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$USER" ~/apt-archives
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AgentDeck ${{ github.ref_name }}
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
