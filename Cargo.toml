[workspace]
resolver = "3"
members = ["crates/agentdeck-core", "crates/agentdeck-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AxelDoussoux/agentdeck"

[workspace.dependencies]
agentdeck-core = { path = "crates/agentdeck-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
